<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haftalık Menü · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <header id="ust"></header>
  <main class="kapsayici">
    <h1>Haftalık menü ve rezervasyon</h1>

    <form id="secim" class="panel form-satir">
      <div>
        <label for="yemekhane">Yemekhane</label>
        <select id="yemekhane" name="yemekhane"></select>
      </div>
      <div>
        <label for="baslangic">Başlangıç günü</label>
        <input id="baslangic" name="baslangic" type="date">
      </div>
      <div class="dugme-grup" style="align-self:end">
        <button type="button" class="dugme dugme-ikincil" id="onceki">‹ Önceki</button>
        <button type="button" class="dugme dugme-ikincil" id="sonraki">Sonraki ›</button>
      </div>
    </form>

    <p id="bildirim" hidden></p>
    <section id="hafta" class="hafta" aria-live="polite"></section>
  </main>

  <script src="/js/ortak.js"></script>
  <script src="/js/hafta.js"></script>
</body>
</html>
