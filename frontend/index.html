<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Yemekhane Otomasyonu</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <main class="kapsayici">
    <section class="panel giris-kutu">
      <h1>Yemekhane</h1>
      <p class="soluk" style="text-align:center">Kampüs yemekhanesi menü, rezervasyon ve bakiye işlemleri</p>

      <p id="bildirim" hidden></p>

      <form id="giris-formu" novalidate>
        <div>
          <label for="eposta">E-posta</label>
          <input id="eposta" name="eposta" type="email" autocomplete="username" required>
        </div>
        <div>
          <label for="sifre">Şifre</label>
          <input id="sifre" name="sifre" type="password" autocomplete="current-password" required>
        </div>
        <button class="dugme" type="submit">Giriş yap</button>
      </form>
    </section>
  </main>

  <script src="/js/ortak.js"></script>
  <script src="/js/giris.js"></script>
</body>
</html>
