<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yönetim · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <header id="ust"></header>
  <main class="kapsayici">
    <h1>Yönetici paneli</h1>
    <p id="bildirim" hidden></p>

    <section class="panel">
      <h2>Menüler · doluluk ve puan</h2>
      <form id="rapor-filtre" class="form-satir">
        <div>
          <label for="r-baslangic">Başlangıç</label>
          <input id="r-baslangic" name="baslangic" type="date">
        </div>
        <div>
          <label for="r-bitis">Bitiş</label>
          <input id="r-bitis" name="bitis" type="date">
        </div>
        <button type="button" class="dugme dugme-ikincil" id="yeni-menu">+ Yeni menü</button>
      </form>
      <div class="tablo-kaydir">
        <table class="tablo tablo-kart">
          <thead>
            <tr>
              <th>Tarih</th><th>Yemekhane</th><th>Öğün</th><th class="sayi">Fiyat (öğr./pers.)</th>
              <th class="sayi">Rezerve</th><th>Doluluk</th><th class="sayi">Puan</th><th></th>
            </tr>
          </thead>
          <tbody id="rapor"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="menu-formu-alani" hidden>
      <h2 id="form-baslik">Yeni menü</h2>
      <form id="menu-formu" novalidate>
        <div class="form-satir">
          <div>
            <label for="f-yemekhane">Yemekhane</label>
            <select id="f-yemekhane" name="yemekhane_id"></select>
          </div>
          <div>
            <label for="f-tarih">Tarih</label>
            <input id="f-tarih" name="tarih" type="date" required>
          </div>
          <div>
            <label for="f-ogun">Öğün</label>
            <select id="f-ogun" name="ogun_id"></select>
          </div>
          <div>
            <label for="f-ogrenci">Öğrenci fiyatı (₺)</label>
            <input id="f-ogrenci" name="ogrenci_fiyati" type="number" min="0" step="0.01" required>
          </div>
          <div>
            <label for="f-personel">Personel fiyatı (₺)</label>
            <input id="f-personel" name="personel_fiyati" type="number" min="0" step="0.01" required>
          </div>
        </div>
        <p class="soluk">Seçili: <strong id="secili-sayi">0</strong> yemek · <strong id="secili-kalori">0</strong> kcal</p>
        <div id="yemek-secim" class="yemek-secim"></div>
        <div class="dugme-grup" style="margin-top:1rem">
          <button class="dugme" type="submit">Kaydet</button>
          <button class="dugme dugme-ikincil" type="button" id="vazgec">Vazgeç</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/js/ortak.js"></script>
  <script src="/js/yonetim.js"></script>
</body>
</html>
