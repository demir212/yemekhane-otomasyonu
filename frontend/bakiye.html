<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakiye · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <header id="ust"></header>
  <main class="kapsayici">
    <h1>Bakiye</h1>

    <section class="panel">
      <p class="soluk">Güncel bakiye</p>
      <p class="bakiye-buyuk" id="bakiye">–</p>
    </section>

    <section class="panel">
      <h2>Bakiye yükle</h2>
      <p id="bildirim" hidden></p>
      <form id="yukle-formu" class="form-satir" novalidate>
        <div>
          <label for="tutar">Tutar (10–1000 TL)</label>
          <input id="tutar" name="tutar" type="number" inputmode="decimal" min="10" max="1000" step="0.01" required>
        </div>
        <div class="dugme-grup" style="align-self:end">
          <button type="button" class="dugme dugme-ikincil dugme-kucuk" data-hizli="50">50 ₺</button>
          <button type="button" class="dugme dugme-ikincil dugme-kucuk" data-hizli="100">100 ₺</button>
          <button type="button" class="dugme dugme-ikincil dugme-kucuk" data-hizli="250">250 ₺</button>
        </div>
        <button class="dugme" type="submit">Yükle</button>
      </form>
    </section>

    <section class="panel">
      <h2>Hareket geçmişi</h2>
      <div class="tablo-kaydir">
        <table class="tablo tablo-kart">
          <thead><tr><th>Zaman</th><th>İşlem</th><th>Açıklama</th><th class="sayi">Tutar</th></tr></thead>
          <tbody id="hareketler"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/ortak.js"></script>
  <script src="/js/bakiye.js"></script>
</body>
</html>
